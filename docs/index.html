<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MWI Market Analyzer</title>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module" defer></script>
</head>
<body>
  <header>
    <h1>MWI Market Analyzer</h1>
    <p class="sub">Price history for Milky Way Idle marketplace items.</p>
  </header>

  <main>
    <section class="search">
      <label for="q">Search item:</label>
      <input id="q" list="items" placeholder="start typing… pick one to add" autocomplete="off">
      <datalist id="items"></datalist>
      <div id="selected" class="chips" aria-label="selected items"></div>
      <p id="status" class="status">Loading item list…</p>
    </section>

    <section class="chart">
      <canvas id="chart" height="360" aria-label="price chart"></canvas>
      <p id="empty" class="empty">No items selected. Pick one above to plot it.</p>
    </section>
  </main>

  <!-- Auto-load the item index on startup (HTMX fires afterRequest on completion) -->
  <div id="boot" hx-get="data/index.json" hx-trigger="load" hx-swap="none"></div>
</body>
</html>
